[platformio]
default_envs = avi_99l_missionboard
test_dir = test/characterization

[env:avi_99l_missionboard]
platform = espressif32@7.0.1
board = avi_99l_missionboard
framework = espidf
platform_packages =
    platformio/tool-esptoolpy@2.41100.0
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DMISSION_BRINGUP_SHELL=0
    -DAVI_99L_IMU_HEARTBEAT_CLOCK=1
    -DAVI_99L_MOTOR_PROFILE_ID=1
    -Wl,--wrap=xTaskDelayUntil

[env:avi_99l_missionboard_bringup]
extends = env:avi_99l_missionboard
build_flags =
    -DMISSION_BRINGUP_SHELL=1
    -DAVI_99L_MOTOR_PROFILE_ID=1

[env:avi_99l_missionboard_can_diag]
extends = env:avi_99l_missionboard
build_flags =
    -DMISSION_BRINGUP_SHELL=1
    -DMISSION_CAN_UNSAFE_DIAG=1
    -DAVI_99L_MOTOR_PROFILE_ID=1

[env:avi_99l_missionboard_characterization]
extends = env:avi_99l_missionboard
extra_scripts =
    pre:tools/pio_characterization_provenance.py
# 既存のroot sdkconfig.<env>がISR dispatch無効設定を保持していても影響しないよう、
# characterization専用の生成先とdefaults layerを使用する。
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.avi_99l_missionboard_characterization_isr
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.characterization.defaults"
build_flags =
    -DMISSION_BRINGUP_SHELL=0
    -DAVI_99L_CHARACTERIZATION=1
    -DAVI_99L_CHARACTERIZATION_COMMAND_TO_FIN_SIGN=-1
    -DAVI_99L_MOTOR_PROFILE_ID=1

[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -pthread
    -Iinclude
build_src_filter =
    -<*>
    +<characterization/best_effort_file_close.cpp>
    +<characterization/campaign_state_machine.cpp>
    +<characterization/command_journal.cpp>
    +<characterization/fin_angle.cpp>
    +<characterization/fixed_epoch_assembler.cpp>
    +<characterization/log_format_v5.cpp>
    +<characterization/position_guard.cpp>
    +<characterization/profile_plan.cpp>
    +<characterization/record_validation.cpp>
    +<characterization/zero_approach.cpp>
