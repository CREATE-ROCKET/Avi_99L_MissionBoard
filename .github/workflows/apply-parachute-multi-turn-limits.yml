name: Apply parachute multi-turn limits

on:
  push:
    branches: [main]
    paths:
      - tools/apply_parachute_multi_turn_limits.py
      - .github/workflows/apply-parachute-multi-turn-limits.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Sync main
        run: git pull --rebase origin main
      - name: Pin verified STS driver
        run: |
          git -C lib/Avi_ESP_Libs fetch origin 122b4bebdfc89eaef364ff59b3bcd18010f83d5e
          git -C lib/Avi_ESP_Libs checkout 122b4bebdfc89eaef364ff59b3bcd18010f83d5e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply targeted patch
        run: python tools/apply_parachute_multi_turn_limits.py
      - name: Check diff
        run: git diff --check
      - name: Run parachute host tests
        run: |
          cmake -S host_test -B host_test/build
          cmake --build host_test/build --target parachute_configuration_tests --parallel
          host_test/build/parachute_configuration_tests
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build production firmware
        env:
          AVI_99L_MOTOR_PROFILE_ID: "1"
        run: pio run -e avi_99l_missionboard
      - name: Commit verified change
        run: |
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add lib/Avi_ESP_Libs src/runtime/production_runtime.cpp docs/04c_ForceStartSequence詳細.md
          git rm tools/apply_parachute_multi_turn_limits.py .github/workflows/apply-parachute-multi-turn-limits.yml
          git commit -m "fix(mission): configure parachute multi-turn limits"
          git push origin HEAD:main
