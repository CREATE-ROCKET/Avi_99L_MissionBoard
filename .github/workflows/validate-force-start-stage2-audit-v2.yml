name: Validate ForceStart Stage 2 audit v2

on:
  push:
    branches:
      - chatgpt/99l-force-start-stage2-audit-v2

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply audit transform
        run: python3 tools/apply_force_start_stage2_audit.py
      - name: Check audit invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'storeStartReadinessAudit(readiness, forced_start)' src/runtime/production_runtime.cpp
          grep -F 'clearStartReadinessAudit' src/runtime/production_runtime.cpp
          grep -F 'RTC preflight audit restored' src/runtime/production_runtime.cpp
          grep -F 'persistence_flags |= 1U << 2U' src/runtime/production_runtime.cpp
          grep -F 'struct StartReadinessAudit' src/runtime/recovery_boot.hpp
          grep -F 'RTC_DATA_ATTR StartReadinessAuditRecord' src/runtime/recovery_boot.cpp
      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S host_test -B build/host_test -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host_test --parallel 2
          ctest --test-dir build/host_test --output-on-failure
      - name: Build production firmware with PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-platformio
          .venv-platformio/bin/pip install --disable-pip-version-check platformio
          .venv-platformio/bin/pio run -e avi_99l_missionboard
      - name: Materialize validated output
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_force_start_stage2_audit.py
          rm .github/workflows/validate-force-start-stage2-audit-v2.yml
          rm -rf build/host_test .venv-platformio .pio
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: materialize validated force-start audit'
          git push origin HEAD:chatgpt/99l-force-start-stage2-audit-v2
