name: Validate ForceStart Stage 2 final v4

on:
  push:
    branches:
      - chatgpt/99l-force-start-stage2-final-v4

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply runtime ordering transform
        run: python3 tools/apply_force_start_stage2_runtime_ordering.py
      - name: Check Stage 2 runtime ordering
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/runtime/production_runtime.cpp').read_text()
          missing = text.index('command_request.readiness.missingMask() != 0')
          power = text.index('!requestPower(pending.started_at_us)', missing - 2500)
          assert missing < power, 'normal missing gate must precede STS power/init'
          assert 'powerOff(false, true, protocol::ParaMode::powered_off);\n        requestFinish(protocol::CommandReason::none);' not in text
          assert 'parachute hold failed outside deployment' in text
          PY
          grep -F 'desired = DesiredState::holding;' src/runtime/production_runtime.cpp
          grep -F 'active_epoch != 0' src/runtime/production_runtime.cpp
      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S host_test -B build/host_test -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host_test --parallel 2
          ctest --test-dir build/host_test --output-on-failure
      - name: Build production firmware with PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-platformio
          .venv-platformio/bin/pip install --disable-pip-version-check platformio
          .venv-platformio/bin/pio run -e avi_99l_missionboard
      - name: Materialize validated output
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_force_start_stage2_runtime_ordering.py
          rm .github/workflows/validate-force-start-stage2-final-v4.yml
          rm -rf build/host_test .venv-platformio .pio
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: materialize validated runtime ordering'
          git push origin HEAD:chatgpt/99l-force-start-stage2-final-v4
