name: rebase-flight-logging

on:
  push:
    branches:
      - fix/vault-storage-finzero-20260816

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply verified logging diff to current main
        run: |
          git fetch origin feat/flight-logging-recovery-20260816
          git diff 75bfe2e183cde664fe0f676b3bc40c6db7f47019..8708b00676bd34b0b55dfa74b78bcbc89e972308 -- \
            host_test/CMakeLists.txt \
            host_test/flight_log_tests.cpp \
            src/runtime/flight_log.cpp \
            src/runtime/flight_log.hpp \
            src/runtime/flight_storage.cpp \
            src/runtime/flight_storage.hpp \
            src/runtime/production_runtime.cpp > /tmp/flight-logging.patch
          git apply --3way /tmp/flight-logging.patch
      - name: Check whitespace
        run: git diff --check
      - name: Configure host tests
        run: cmake -S host_test -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/host --parallel 2
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - name: Build production firmware
        run: AVI_99L_MOTOR_PROFILE_ID=1 pio run -e avi_99l_missionboard
      - name: Commit rebased logging implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rebase-flight-logging.yml
          git add host_test/CMakeLists.txt host_test/flight_log_tests.cpp src/runtime/flight_log.cpp src/runtime/flight_log.hpp src/runtime/flight_storage.cpp src/runtime/flight_storage.hpp src/runtime/production_runtime.cpp
          git commit -m "chore(logging): rebase flight logging on current main"
          git push origin HEAD:fix/vault-storage-finzero-20260816
