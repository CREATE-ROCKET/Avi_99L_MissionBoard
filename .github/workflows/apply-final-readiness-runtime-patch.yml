name: Apply final readiness runtime patch

on:
  push:
    branches:
      - fix/vault-final-flight-readiness-20260816
    paths:
      - tools/apply_final_readiness_runtime_patch.py
      - .github/workflows/apply-final-readiness-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-final-flight-readiness-20260816
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/apply_final_readiness_runtime_patch.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit patched runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/production_runtime.cpp
          git rm tools/apply_final_readiness_runtime_patch.py
          git rm .github/workflows/apply-final-readiness-runtime-patch.yml
          git commit -m "feat(mission): align final runtime readiness"
          git push origin HEAD:fix/vault-final-flight-readiness-20260816
