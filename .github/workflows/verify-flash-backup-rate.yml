name: verify-flash-backup-rate
on:
  push:
    branches: [feat/flight-logging-recovery-20260816]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: python3 tools/fix_flash_backup_rate.py
      - run: git diff --check
      - run: cmake -S host_test -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host --parallel 2
      - run: ctest --test-dir build/host --output-on-failure
      - run: python3 -m pip install platformio
      - run: AVI_99L_MOTOR_PROFILE_ID=1 pio run -e avi_99l_missionboard
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/fix_flash_backup_rate.py .github/workflows/verify-flash-backup-rate.yml
          git add src/runtime/production_runtime.cpp
          git commit -m 'fix(logging): use 50 Hz flash backup rate'
          git push origin HEAD:feat/flight-logging-recovery-20260816
