name: Apply parachute simplification

on:
  push:
    branches:
      - fix/simplify-parachute-servo
    paths:
      - .github/workflows/apply-parachute-simplification.yml
      - tools/apply_runtime_v2.py
      - tools/fix_runtime_patch_script.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Apply runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_runtime_patch_script.py
          python tools/apply_runtime_v2.py
      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S host_test -B host_test/build
          cmake --build host_test/build --parallel 2
          ctest --test-dir host_test/build --output-on-failure
      - name: Validate retired parachute paths are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'ParachutePersistence|parachute_persistence_|parachute_config_load_complete|parachute_open_configured|parachute_close_configured|configureMultiTurnPositionMode|servo\.disableTorque\(\)|ParaRequest::Kind::free|nvs_(open|set_blob|get_blob|flash_init)' src/runtime/production_runtime.cpp
          grep -n 'moveRelativeDegrees' src/runtime/production_runtime.cpp
          grep -n 'kParachuteOpenRelativeDegrees' src/runtime/production_runtime.cpp
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/apply-parachute-simplification.yml tools/apply_parachute.py.gz.b64 tools/apply_runtime_v2.py tools/fix_runtime_patch_script.py
          git add -A
          git update-index --add --cacheinfo 160000,43a185ab2a570d4e1b889a4a534984fd19b2194f,lib/Avi_ESP_Libs
          git diff --cached --check
          git commit -m 'fix(mission): simplify parachute servo control'
          git push origin HEAD:fix/simplify-parachute-servo