name: Apply parachute absolute position-mode fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_parachute_position_mode.py
      - .github/workflows/apply-parachute-position-mode.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Sync main
        run: git pull --rebase origin main
      - name: Pin verified STS driver
        run: |
          git -C lib/Avi_ESP_Libs fetch origin 3622a9e503944e02dfe9ce50b902e69799a1637d
          git -C lib/Avi_ESP_Libs checkout 3622a9e503944e02dfe9ce50b902e69799a1637d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply targeted patch
        run: python tools/apply_parachute_position_mode.py
      - name: Check diff
        run: git diff --check
      - name: Run host tests
        run: |
          cmake -S host_test -B host_test/build
          cmake --build host_test/build --parallel
          ctest --test-dir host_test/build --output-on-failure
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build production firmware
        env:
          AVI_99L_MOTOR_PROFILE_ID: "1"
        run: pio run -e avi_99l_missionboard
      - name: Commit verified change
        run: |
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add lib/Avi_ESP_Libs src/runtime/production_runtime.cpp src/actuators/parachute_configuration.hpp host_test/parachute_configuration_tests.cpp docs/04a_量子化・エラーコード詳細.md docs/04c_ForceStartSequence詳細.md
          git rm tools/apply_parachute_position_mode.py .github/workflows/apply-parachute-position-mode.yml
          git commit -m "fix(mission): use absolute parachute position mode"
          git push origin HEAD:main
