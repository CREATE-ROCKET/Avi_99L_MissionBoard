name: verify-flight-logging

on:
  push:
    branches:
      - feat/flight-logging-recovery-20260816

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flight-logging-recovery-20260816
          submodules: recursive
      - name: Apply checked runtime patch
        run: python3 tools/apply_flight_logging_runtime.py
      - name: Check whitespace
        run: git diff --check
      - name: Configure host tests
        run: cmake -S host_test -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/host --parallel 2
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - name: Build production firmware
        run: AVI_99L_MOTOR_PROFILE_ID=1 pio run -e avi_99l_missionboard
      - name: Commit verified runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_flight_logging_runtime.py .github/workflows/verify-flight-logging.yml
          git add src/runtime/production_runtime.cpp
          git commit -m "feat(logging): connect flight storage runtime"
          git push origin HEAD:feat/flight-logging-recovery-20260816
