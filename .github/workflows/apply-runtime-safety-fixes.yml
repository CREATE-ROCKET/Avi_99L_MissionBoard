name: Apply forced-start fin safety guard

on:
  push:
    branches: [main]
    paths:
      - tools/apply_runtime_safety_fixes.py
      - .github/workflows/apply-runtime-safety-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply targeted runtime guard
        run: python3 tools/apply_runtime_safety_fixes.py
      - name: Check and commit
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add src/runtime/production_runtime.cpp
          git commit -m "fix(mission): enforce forced-start motor profile guard"
          git push origin HEAD:main
