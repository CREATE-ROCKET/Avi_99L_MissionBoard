name: apply-vault-runtime-patch

on:
  push:
    branches:
      - fix/vault-recovery-profile-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-recovery-profile-20260816
      - name: Apply checked patch
        run: python3 tools/apply_vault_runtime_patch.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit patched runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_vault_runtime_patch.py .github/workflows/apply-vault-runtime-patch.yml
          git add src/runtime/production_runtime.cpp
          git commit -m "fix(runtime): move recovery ownership to mission board"
          git push origin HEAD:fix/vault-recovery-profile-20260816
