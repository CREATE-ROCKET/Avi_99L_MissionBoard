name: Validate Vault alignment

"on":
  push:
    branches:
      - chatgpt/99l-force-start-vault-alignment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Vault alignment
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/vault_align.py
          python3 /tmp/vault_align.py
          git diff --check

      - name: Run host tests
        shell: bash
        run: |
          cmake -S host_test -B build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure

      - name: Install PlatformIO
        shell: bash
        run: |
          python3 -m pip install --user "platformio==6.1.18"

      - name: Build with explicit MotorProfile
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PLATFORMIO_BUILD_FLAGS="-DMISSION_BRINGUP_SHELL=0 -DAVI_99L_MOTOR_PROFILE_ID=1" pio run -e avi_99l_missionboard

      - name: Verify missing MotorProfile fails closed
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pio run -e avi_99l_missionboard -t clean
          if PLATFORMIO_BUILD_FLAGS="-DMISSION_BRINGUP_SHELL=0" pio run -e avi_99l_missionboard; then
            echo "unexpected success without AVI_99L_MOTOR_PROFILE_ID"
            exit 1
          fi

      - name: Commit validated alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mission): align force-start readiness with Vault"
          git push --force origin HEAD:chatgpt/99l-force-start-vault-alignment
