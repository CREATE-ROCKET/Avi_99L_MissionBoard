name: Validate Vault alignment

on:
  push:
    branches:
      - chatgpt/99l-force-start-vault-alignment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Vault alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          board = Path("src/config/board_config.hpp")
          text = board.read_text()
          old = '''// TODO(HW_TEST): FlightMotorAの極性、巻線抵抗、定数、効率、電流上限を実測値へ置換する。
// 現値はhost testで使っていた候補値であり、flight qualification済みではない。
constexpr MotorProfile kFlightMotorA{1, MotorPolarity::positive_in1, true,
                                     3.48F, 0.00855F, 1120.0F, 0.60F,
                                     2.0F, 1.21208F};
// TODO(HW_TEST): SpareMotorB実測値
constexpr MotorProfile kSpareMotorB{2, MotorPolarity::unconfigured, false,
                                    0.0F, 0.0F, 0.0F, 0.0F, 0.0F, 0.0F};
'''
          new = '''// TODO(HW_TEST): FlightMotorAの極性、巻線抵抗、定数、効率、電流上限を実測値へ置換する。
// 現値はhost testで使っていた候補値であり、flight qualification済みではない。
inline constexpr MotorProfile kFlightMotorA{
    1, MotorPolarity::positive_in1, true, 3.48F, 0.00855F, 1120.0F,
    0.60F, 2.0F, 1.21208F};
inline constexpr bool kFlightMotorAQualified = false; // TODO(HW_TEST)

// TODO(HW_TEST): SpareMotorB実測値とqualification。
inline constexpr MotorProfile kSpareMotorB{
    2, MotorPolarity::unconfigured, false, 0.0F, 0.0F, 0.0F,
    0.0F, 0.0F, 0.0F};
inline constexpr bool kSpareMotorBQualified = false;

#ifndef AVI_99L_MOTOR_PROFILE_ID
#error "AVI_99L_MOTOR_PROFILE_ID must be selected at build time"
#elif AVI_99L_MOTOR_PROFILE_ID == 1
inline constexpr const MotorProfile &kActiveMotorProfile = kFlightMotorA;
inline constexpr bool kActiveMotorProfileQualified = kFlightMotorAQualified;
#elif AVI_99L_MOTOR_PROFILE_ID == 2
inline constexpr const MotorProfile &kActiveMotorProfile = kSpareMotorB;
inline constexpr bool kActiveMotorProfileQualified = kSpareMotorBQualified;
#else
#error "Unsupported AVI_99L_MOTOR_PROFILE_ID"
#endif

inline constexpr bool kMotorProfileValid =
    kActiveMotorProfile.parameters_valid &&
    kActiveMotorProfile.polarity != MotorPolarity::unconfigured &&
    kActiveMotorProfileQualified;
'''
          if old not in text:
              raise SystemExit("board_config MotorProfile block not found")
          board.write_text(text.replace(old, new))

          flight = Path("src/config/flight_config.hpp")
          text = flight.read_text()
          old = '''[[nodiscard]] inline bool motorProfileValid() {
  return board::kFlightMotorA.parameters_valid &&
         board::kFlightMotorA.polarity != board::MotorPolarity::unconfigured;
}
'''
          new = '''[[nodiscard]] inline bool motorProfileValid() {
  return board::kMotorProfileValid;
}
'''
          if old not in text:
              raise SystemExit("flight_config motorProfileValid block not found")
          flight.write_text(text.replace(old, new))

          runtime = Path("src/runtime/production_runtime.cpp")
          text = runtime.read_text()
          if text.count("board::kFlightMotorA") != 2:
              raise SystemExit("unexpected kFlightMotorA runtime reference count")
          text = text.replace(
              "control::TorqueMapper torque_mapper{board::kFlightMotorA,",
              "control::TorqueMapper torque_mapper{board::kActiveMotorProfile,")
          text = text.replace(
              "(board::kFlightMotorA.parameters_valid ? (1U << 0U) : 0U)",
              "(board::kMotorProfileValid ? (1U << 0U) : 0U)")
          if "board::kFlightMotorA" in text:
              raise SystemExit("runtime still references fixed FlightMotorA")
          runtime.write_text(text)

          executor = Path("src/mission/command_executor.cpp")
          text = executor.read_text()
          old = '''         (raw >= 0x20 && raw <= 0x26) ||
         (raw >= 0x30 && raw <= 0x32);'''
          new = '''         (raw >= 0x20 && raw <= 0x26) ||
         (raw >= 0x30 && raw <= 0x31);'''
          if old not in text:
              raise SystemExit("commandKnown range not found")
          executor.write_text(text.replace(old, new))

          tests = Path("host_test/mission_host_tests.cpp")
          text = tests.read_text()
          marker = '''  CommandExecutor cache;
  for (uint8_t id = 1; id <= CommandExecutor::kResultCacheSize; ++id) {'''
          addition = '''  CommandExecutor reserved_motor_profile;
  auto reserved_profile =
      command(0x6E, static_cast<uint8_t>(CommandCode::select_motor_profile));
  reserved_profile.arguments[0] = 0xFF;
  assert(reserved_motor_profile.begin(reserved_profile, context).result.reason ==
         CommandReason::not_supported);

  CommandExecutor cache;
  for (uint8_t id = 1; id <= CommandExecutor::kResultCacheSize; ++id) {'''
          if marker not in text:
              raise SystemExit("command cache test marker not found")
          tests.write_text(text.replace(marker, addition))

          readme = Path("README.md")
          text = readme.read_text()
          old = '''- productionの手動Para commandは接続済みです。`SetParaOpen` / `SetParaClose`は全argumentを0とし、現在位置だけを保存します。通常`StartSequence`は両endpointとhalf-turn条件を検証します。`ForceStartSequence`、Force用optional snapshot、Force時の未設定Open処理はStage 2であり、今回未実装です。productionの手動Fin commandと明示PreflightCalibration commandは未接続で、差圧zeroはCommandReceive中の自動取得で代用しています。'''
          new = '''- productionの手動Para commandは接続済みです。`SetParaOpen` / `SetParaClose`は全argumentを0とし、現在位置だけを保存します。通常`StartSequence`は7項目readinessを同一snapshotで評価し、`ForceStartSequence 0x04`はそのmissing maskだけをbypassします。Open/Closeはflight snapshotでも独立optionalのまま保持し、actual current→targetがexact half-turnの場合だけ移動しません。Open失敗または5秒retry期限後もSTSはHold要求と再接続を続け、電源は離床+25秒の絶対cutoffまで維持します。明示`RunPreflightCalibration`はgyro bias、gravity reference、SSC zeroの最新attemptを更新し、Force時もinvalid値をvalidへ偽装しません。'''
          if old not in text:
              raise SystemExit("README Stage 2 limitation text not found")
          text = text.replace(old, new)
          build_section = '''\n## production MotorProfile build\n\nactive MotorProfileはruntime/NVSでは選択しません。`AVI_99L_MOTOR_PROFILE_ID`をbuild時に必ず明示し、未指定または未知IDはcompile errorにします。例えばFlightMotorA候補を選ぶ場合は次のようにbuildします。\n\n```sh\nPLATFORMIO_BUILD_FLAGS="-DMISSION_BRINGUP_SHELL=0 -DAVI_99L_MOTOR_PROFILE_ID=1" pio run -e avi_99l_missionboard\n```\n\nID 1は現在も`TODO(HW_TEST)`のqualification未完了なので、選択してbuildできても`MotorProfileValid=false`です。通常`StartSequence`ではreadiness bit3がmissingになり、`ForceStartSequence`でも状態をvalidへ書き換えません。\n'''
          anchor = "\n## hardware assumptions\n"
          if anchor not in text:
              raise SystemExit("README hardware assumptions anchor not found")
          text = text.replace(anchor, build_section + anchor, 1)
          readme.write_text(text.rstrip() + "\n")
          PY
          rm .github/workflows/vault-alignment.yml
          git diff --check

      - name: Run host tests
        shell: bash
        run: |
          cmake -S host_test -B build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure

      - name: Validate explicit production MotorProfile build
        shell: bash
        run: |
          python3 -m pip install --user "platformio==6.1.18"
          export PATH="$HOME/.local/bin:$PATH"
          PLATFORMIO_BUILD_FLAGS="-DMISSION_BRINGUP_SHELL=0 -DAVI_99L_MOTOR_PROFILE_ID=1" \
            pio run -e avi_99l_missionboard

      - name: Verify missing MotorProfile selection fails closed
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if PLATFORMIO_BUILD_FLAGS="-DMISSION_BRINGUP_SHELL=0" pio run -e avi_99l_missionboard; then
            echo "build unexpectedly succeeded without AVI_99L_MOTOR_PROFILE_ID"
            exit 1
          fi

      - name: Commit validated alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mission): align force-start readiness with Vault"
          git push --force origin HEAD:chatgpt/99l-force-start-vault-alignment
