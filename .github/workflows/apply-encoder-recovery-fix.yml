name: Apply encoder recovery fix

on:
  push:
    branches:
      - fix/vault-final-flight-readiness-20260816
    paths:
      - tools/apply_encoder_recovery_fix.py
      - .github/workflows/apply-encoder-recovery-fix.yml

permissions:
  contents: write

jobs:
  patch-encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-final-flight-readiness-20260816
          fetch-depth: 0
      - run: python3 tools/apply_encoder_recovery_fix.py
      - run: git diff --check
      - name: Commit patched encoder
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bringup/encoder_bringup.cpp
          git rm tools/apply_encoder_recovery_fix.py
          git rm .github/workflows/apply-encoder-recovery-fix.yml
          git commit -m "fix(mission): recover encoder after initial fault"
          git push origin HEAD:fix/vault-final-flight-readiness-20260816
