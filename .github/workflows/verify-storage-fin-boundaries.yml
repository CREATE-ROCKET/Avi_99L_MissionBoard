name: verify-storage-fin-boundaries

on:
  push:
    branches:
      - fix/vault-storage-finzero-20260816

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply boundary fixes
        run: python3 tools/apply_storage_fin_boundaries.py
      - name: Check boundary invariants
        run: |
          grep -q 'export_completion.pending' src/runtime/production_runtime.cpp
          ! grep -q 'xQueueSendToFront(storage_export_queue' src/runtime/production_runtime.cpp
          grep -q 'zero設定前の仮の0 rad系列' src/runtime/production_runtime.cpp
      - name: Check whitespace
        run: git diff --check
      - name: Configure host tests
        run: cmake -S host_test -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/host --parallel 2
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - name: Build production firmware
        run: AVI_99L_MOTOR_PROFILE_ID=1 pio run -e avi_99l_missionboard
      - name: Commit verified boundary fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_storage_fin_boundaries.py .github/workflows/verify-storage-fin-boundaries.yml
          git add src/runtime/production_runtime.cpp
          git commit -m "fix(mission): harden storage and fin command boundaries"
          git push origin HEAD:fix/vault-storage-finzero-20260816
