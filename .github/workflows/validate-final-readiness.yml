name: Validate final readiness

on:
  push:
    branches:
      - fix/vault-final-flight-readiness-20260816
    paths:
      - .github/workflows/validate-final-readiness.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-final-flight-readiness-20260816
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Build production firmware
        shell: bash
        run: |
          set +e
          set -o pipefail
          pio run -e avi_99l_missionboard 2>&1 | tee /tmp/mission-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "(^|[[:space:]])(fatal )?error:|undefined reference|collect2:" /tmp/mission-build.log | tail -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
      - name: Run native tests
        run: pio test -e native
      - run: git diff --check
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/validate-final-readiness.yml
          git commit -m "test(mission): validate final readiness build"
          git push origin HEAD:fix/vault-final-flight-readiness-20260816
