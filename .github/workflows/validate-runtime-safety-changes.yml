name: Validate runtime safety changes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-runtime-safety-changes.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build production firmware
        run: pio run -e avi_99l_missionboard
