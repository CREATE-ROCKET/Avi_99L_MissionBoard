name: Apply SSC air-data reliability fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_ssc_reliability_fixes.py
      - .github/workflows/apply-ssc-reliability-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Apply targeted SSC changes
        run: python3 tools/apply_ssc_reliability_fixes.py
      - name: Check patch
        run: git diff --check
      - name: Build production firmware
        run: pio run -e avi_99l_missionboard
      - name: Commit verified change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add src/runtime/production_runtime.cpp
          git commit -m "fix(mission): preserve SSC reconnect diagnostics"
          git push origin HEAD:main
